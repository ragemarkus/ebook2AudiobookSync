# Read-along sidecar generator (run on demand, not a long-running service).
#
# G14 (RTX 4080, Docker Desktop + WSL2 or Linux + NVIDIA Container Toolkit):
#   docker compose run --rm readalong-gpu "/books/Title/Title.epub" "/books/Title/audio" \
#       --abs-item-id li_xxx --model medium.en
# Dell XPS (CPU only, slow but unattended):
#   docker compose run --rm readalong-cpu "/books/Title/Title.epub" "/books/Title/audio" \
#       --abs-item-id li_xxx --model small.en
# Output: /books/Title/Title.readalong.json next to the EPUB.
x-common: &common
  volumes:
    - ./books:/books          # work folder: <Title>/<Title>.epub + audio/ (abs_fetch.py makes this)
    - ./models:/models        # Whisper model cache, downloaded once
  environment:
    - HF_HOME=/models

services:
  readalong-gpu:
    <<: *common
    build: .
    image: readalong-sidecar:gpu
    gpus: all
    command: ["--help"]

  readalong-cpu:
    <<: *common
    build:
      context: .
      args:
        BASE: python:3.12-slim
    image: readalong-sidecar:cpu
    cpus: 2                    # leave the XPS usable for its other containers
    mem_limit: 4g
    command: ["--help"]
